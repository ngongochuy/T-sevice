<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Quản trị admin | TĐ Technical Service</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f7fa;color:#142235;font:16px/1.55 system-ui,sans-serif}
    header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:18px max(5vw,16px);background:#102938;color:white}
    header a{color:inherit}
    main{width:min(100% - 32px,1050px);margin:30px auto}
    section,article{padding:20px;margin:12px 0;background:white;border:1px solid #dbe5ee;border-radius:14px}
    #login-panel{max-width:460px;margin-inline:auto}
    label{display:block;margin:12px 0}
    input,select,button{font:inherit;padding:8px 11px;border:1px solid #aabac8;border-radius:8px}
    input{width:100%;min-width:0}
    button{background:#1769aa;color:#fff;border-color:#1769aa;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}
    h1,h2,h3{margin:0 0 12px}
    nav{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0}
    #admin-status{min-height:1.55em}
    #admin-status.error{color:#932a18}
    #requests-list article{overflow-wrap:anywhere}
    .request-notes{white-space:pre-wrap}
    .document-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;overflow-wrap:anywhere}
    .product-preview{display:block;width:160px;max-width:100%;height:110px;object-fit:contain}
    [hidden]{display:none!important}
  </style>
  <script src="supabase-config.js" defer></script>
  <script src="admin.js?v=20261128-1" defer></script>
</head>
<body>
  <header><strong>TĐ TECHNICAL SERVICE</strong><a href="./">Về website</a></header>
  <main>
    <p id="admin-status" role="status">Đang kiểm tra kết nối…</p>
    <section id="login-panel" hidden>
      <h1>Quản trị admin</h1>
      <form id="admin-login">
        <label>Email <input type="email" name="email" autocomplete="username" required></label>
        <label>Mật khẩu <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Đăng nhập</button>
        <button type="button" id="forgot-password">Quên mật khẩu</button>
      </form>
    </section>
    <section id="recovery-panel" hidden>
      <h1>Đặt lại mật khẩu</h1>
      <form id="recovery-form">
        <label>Mật khẩu mới <input type="password" name="newPassword" autocomplete="new-password" minlength="8" required></label>
        <label>Nhập lại mật khẩu <input type="password" name="confirmation" autocomplete="new-password" minlength="8" required></label>
        <button type="submit">Lưu mật khẩu mới</button>
      </form>
    </section>
    <div id="admin-panel" hidden>
      <h1>Quản trị admin</h1>
      <button type="button" id="admin-logout">Đăng xuất</button>
      <nav aria-label="Điều hướng quản trị">
        <a href="#requests">Yêu cầu hỗ trợ và báo giá</a>
        <a href="#product-images">Ảnh sản phẩm</a>
        <a href="#documents">Tài liệu nội bộ</a>
      </nav>
      <section id="requests">
        <h2>Yêu cầu hỗ trợ và báo giá</h2>
        <div id="requests-list"></div>
        <button type="button" id="requests-more" hidden>Tải yêu cầu cũ hơn</button>
      </section>
      <section id="product-images">
        <h2>Ảnh sản phẩm</h2>
        <p>Ảnh sẽ hiển thị công khai. Hỗ trợ JPG, PNG và WebP tối đa 5 MB.</p>
        <form id="image-upload">
          <label>Sản phẩm
            <select name="product">
              <option value="drive">Biến tần &amp; bộ điều khiển động cơ</option>
              <option value="battery">Pin Lithium &amp; hệ thống BMS</option>
              <option value="power">IGBT, MOSFET &amp; module công suất</option>
              <option value="board">Bo mạch, driver &amp; IC nguồn</option>
            </select>
          </label>
          <img class="product-preview" id="product-preview" alt="Ảnh sản phẩm hiện tại" hidden>
          <label>Tệp ảnh <input type="file" name="file" accept="image/jpeg,image/png,image/webp" required></label>
          <button type="submit">Lưu ảnh</button>
        </form>
      </section>
      <section id="documents">
        <h2>Tài liệu nội bộ</h2>
        <form id="document-upload">
          <label>PDF, DOCX, XLSX hoặc PPTX, tối đa 20 MB
            <input type="file" name="file" accept=".pdf,.docx,.xlsx,.pptx" required>
          </label>
          <button type="submit">Thêm tài liệu</button>
        </form>
        <ul id="documents-list"></ul>
        <button type="button" id="documents-more" hidden>Tải thêm tài liệu</button>
      </section>
    </div>
  </main>
</body>
</html>
